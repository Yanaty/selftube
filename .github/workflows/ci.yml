name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Тесты пишут в SQLite-файл; в CI он одноразовый.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, а не 20: jsdom тянет свежий undici, который зовёт
          # webidl.util.markAsUncloneable — в Node 20 этого API ещё нет, и все
          # тестовые воркеры падают на старте. Локально разработка идёт на 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # Клиент Prisma генерируется в postinstall, но повторим явно: шаг дешёвый,
      # а падение без типов выглядит как тридцать несвязанных ошибок.
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
