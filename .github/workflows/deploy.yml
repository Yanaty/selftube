name: Deploy

# Выкатывает main на Fly.io. Нужен секрет FLY_API_TOKEN в настройках репозитория
# (Settings → Secrets and variables → Actions), получить: fly tokens create deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
