# Конфигурация Fly.io. Имя приложения и регион поменяйте под себя:
# fly launch --no-deploy  создаст их сам, либо отредактируйте руками.
app = "multiki"
primary_region = "waw"

[build]

[env]
  PORT = "8080"
  DATABASE_URL = "file:/data/dev.db"

# Постоянный диск: без него SQLite-база стиралась бы при каждом деплое.
[mounts]
  source = "multiki_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Автосинхронизации нет, ничего фонового в процессе не крутится — машина
  # спокойно засыпает без запросов и просыпается на первый же. Так дешевле.
  # Если включите планировщик из src/lib/scheduler.ts, верните false и 1.
  auto_stop_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
